<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Bee Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F4EF;
    --paper-raised: #FFFFFF;
    --ink: #1C2A22;
    --ink-soft: #55635B;
    --line: #D9DED4;
    --bio: #3F7D5C;
    --bio-bg: #E4EFE8;
    --chem: #AB5C42;
    --chem-bg: #F3E4DD;
    --earth: #3F5F8A;
    --earth-bg: #E1E7F0;
    --gen: #8A6A2E;
    --gen-bg: #F0E7D3;
    --mix: #5B4B7A;
    --mix-bg: #E8E3F0;
    --good: #2E7D4F;
    --good-bg: #DFF0E5;
    --bad: #B23B2E;
    --bad-bg: #F6E1DD;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171D19;
      --paper-raised: #202A23;
      --ink: #EAEFE9;
      --ink-soft: #A7B3AA;
      --line: #33413A;
      --bio-bg: #23352A;
      --chem-bg: #35281F;
      --earth-bg: #212B3B;
      --gen-bg: #332B18;
      --mix-bg: #2A2436;
      --good-bg: #1E3527;
      --bad-bg: #3A241F;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171D19;
    --paper-raised: #202A23;
    --ink: #EAEFE9;
    --ink-soft: #A7B3AA;
    --line: #33413A;
    --bio-bg: #23352A;
    --chem-bg: #35281F;
    --earth-bg: #212B3B;
    --gen-bg: #332B18;
    --mix-bg: #2A2436;
    --good-bg: #1E3527;
    --bad-bg: #3A241F;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  header.top .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }

  /* ---- topic select ---- */
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 20px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    transition: transform 0.12s ease, border-color 0.12s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 108px;
  }
  .card:hover { transform: translateY(-2px); }
  .card:active { transform: translateY(0); }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; }
  .card .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; }
  .card .count { font-size: 12.5px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
  .card.bio { border-color: var(--bio); } .card.bio .dot { background: var(--bio); }
  .card.chem { border-color: var(--chem); } .card.chem .dot { background: var(--chem); }
  .card.earth { border-color: var(--earth); } .card.earth .dot { background: var(--earth); }
  .card.gen { border-color: var(--gen); } .card.gen .dot { background: var(--gen); }
  .card.mix { grid-column: 1 / -1; border-color: var(--mix); flex-direction: row; align-items: center; justify-content: space-between; }
  .card.mix .dot { background: var(--mix); }

  /* ---- quiz screen ---- */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .back-btn {
    background: none; border: none; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; cursor: pointer; padding: 6px 0; display: flex; align-items: center; gap: 5px;
  }
  .progress-track { flex: 1; height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 0 14px; }
  .progress-fill { height: 100%; background: var(--topic-color, var(--mix)); transition: width 0.25s ease; }
  .score-pill {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft);
    white-space: nowrap;
  }
  .q-topic-tag {
    display: inline-block; font-size: 11.5px; font-family: 'IBM Plex Mono', monospace;
    color: var(--topic-color, var(--mix)); background: var(--topic-bg, var(--mix-bg));
    padding: 4px 9px; border-radius: 20px; margin-bottom: 14px;
  }
  .question-box {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 20px; margin-bottom: 16px;
  }
  .q-text { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600; line-height: 1.35; margin: 0; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: var(--paper-raised); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 14px 16px; text-align: left; font-family: inherit; font-size: 15.5px; color: var(--ink);
    cursor: pointer; display: flex; gap: 10px; align-items: flex-start; line-height: 1.4;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt .letter {
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 5px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .opt:hover:not(.locked) { border-color: var(--topic-color, var(--ink-soft)); }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .letter { border-color: var(--good); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .letter { border-color: var(--bad); color: var(--bad); }
  .opt.locked { cursor: default; }
  .opt.dim { opacity: 0.55; }
  .explain {
    font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin-top: 14px;
    padding-top: 14px; border-top: 1px dashed var(--line); display: none;
  }
  .explain.show { display: block; }
  .next-btn {
    width: 100%; margin-top: 16px; padding: 14px; border-radius: 10px; border: none;
    background: var(--ink); color: var(--paper); font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600; font-size: 15px; cursor: pointer; display: none;
  }
  .next-btn.show { display: block; }

  /* ---- results ---- */
  .result-hero { text-align: center; padding: 30px 10px 20px; }
  .result-score {
    font-family: 'Fraunces', serif; font-size: 56px; font-weight: 700; line-height: 1;
  }
  .result-frac { color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-top: 6px; }
  .result-msg { font-size: 15px; color: var(--ink-soft); margin-top: 10px; }
  .review-item {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .review-item .rq { font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
  .review-item .ra { font-size: 13.5px; margin: 3px 0; }
  .review-item .ra.you { color: var(--bad); }
  .review-item .ra.right { color: var(--good); }
  .section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 26px 0 12px;
  }
  .retry-btn {
    width: 100%; margin-top: 8px; padding: 14px; border-radius: 10px; border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer;
    font-family: inherit;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="kicker">SHS QUIZ BEE // FIELD REVIEWER</div>
      <h1 class="title">Science Reviewer</h1>
    </div>
  </header>

  <!-- SCREEN 1: TOPIC SELECT -->
  <div id="screen-select">
    <p class="subtitle">Pick a topic to drill, or run the mixed set to simulate the real thing. Questions and choices shuffle each time.</p>
    <div class="grid">
      <button class="card gen" data-topic="general"><span class="dot"></span><span class="name">General<br>Science</span><span class="count" id="count-general"></span></button>
      <button class="card earth" data-topic="earth"><span class="dot"></span><span class="name">Earth<br>Science</span><span class="count" id="count-earth"></span></button>
      <button class="card bio" data-topic="biology"><span class="dot"></span><span class="name">Biology</span><span class="count" id="count-biology"></span></button>
      <button class="card chem" data-topic="chemistry"><span class="dot"></span><span class="name">Chemistry</span><span class="count" id="count-chemistry"></span></button>
      <button class="card mix" data-topic="mixed"><span style="display:flex;align-items:center;gap:10px;"><span class="dot"></span><span class="name">Mixed Review — all topics</span></span><span class="count" id="count-mixed"></span></button>
    </div>
  </div>

  <!-- SCREEN 2: QUIZ -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-head">
      <button class="back-btn" id="quit-btn">&larr; quit</button>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="score-pill" id="score-pill">0/0</div>
    </div>
    <div class="q-topic-tag" id="q-topic-tag"></div>
    <div class="question-box">
      <p class="q-text" id="q-text"></p>
    </div>
    <div class="options" id="options"></div>
    <div class="explain" id="explain"></div>
    <button class="next-btn" id="next-btn">Next question</button>
  </div>

  <!-- SCREEN 3: RESULTS -->
  <div id="screen-results" class="hidden">
    <div class="result-hero">
      <div class="result-score" id="result-score">0%</div>
      <div class="result-frac" id="result-frac">0 / 0 correct</div>
      <div class="result-msg" id="result-msg"></div>
    </div>
    <div id="review-list"></div>
    <button class="retry-btn" id="retry-btn">Try another set</button>
  </div>

</div>

<script>
const TOPIC_META = {
  general: { label: 'General Science', color: 'var(--gen)', bg: 'var(--gen-bg)' },
  earth:   { label: 'Earth Science',    color: 'var(--earth)', bg: 'var(--earth-bg)' },
  biology: { label: 'Biology',          color: 'var(--bio)', bg: 'var(--bio-bg)' },
  chemistry:{ label: 'Chemistry',       color: 'var(--chem)', bg: 'var(--chem-bg)' },
};

const QUESTIONS = {
  general: [
    { q: "Which step of the scientific method comes right after forming a hypothesis?", o: ["Drawing a conclusion", "Designing and running an experiment", "Stating the problem", "Publishing the results"], a: 1, e: "A hypothesis is tested through a controlled experiment before any conclusion is drawn." },
    { q: "What is the SI base unit of mass?", o: ["Gram", "Pound", "Kilogram", "Newton"], a: 2, e: "The kilogram (kg) is the SI base unit of mass; the gram is a derived, smaller unit." },
    { q: "A change of state from a solid directly to a gas is called:", o: ["Condensation", "Sublimation", "Deposition", "Evaporation"], a: 1, e: "Sublimation skips the liquid phase entirely, e.g. dry ice turning to CO2 gas." },
    { q: "Which quantity is a vector, not a scalar?", o: ["Speed", "Distance", "Mass", "Velocity"], a: 3, e: "Velocity has both magnitude and direction; speed, distance, and mass are magnitude only." },
    { q: "A simple machine that is a grooved wheel with a rope running along the groove is a:", o: ["Lever", "Pulley", "Wedge", "Screw"], a: 1, e: "A pulley changes the direction (and sometimes magnitude) of an applied force." },
    { q: "Who is credited with formulating the three laws of motion?", o: ["Galileo Galilei", "Isaac Newton", "Albert Einstein", "Johannes Kepler"], a: 1, e: "Newton published the laws of motion in the Principia Mathematica (1687)." },
    { q: "Which form of energy is stored due to an object's position or condition?", o: ["Kinetic energy", "Thermal energy", "Potential energy", "Radiant energy"], a: 2, e: "Potential energy depends on position, such as height above the ground or a stretched spring." },
    { q: "The law of conservation of energy states that energy:", o: ["Can be created but not destroyed", "Can be destroyed but not created", "Cannot be created or destroyed, only transformed", "Always increases in a closed system"], a: 2, e: "Energy only changes form or transfers between objects; the total amount stays constant." },
    { q: "Which instrument is used to measure atmospheric pressure?", o: ["Thermometer", "Barometer", "Hygrometer", "Anemometer"], a: 1, e: "A barometer measures air pressure; a hygrometer measures humidity, an anemometer measures wind speed." },
    { q: "In an experiment, the variable that a researcher deliberately changes is the:", o: ["Dependent variable", "Controlled variable", "Independent variable", "Confounding variable"], a: 2, e: "The independent variable is manipulated; the dependent variable is what's measured in response." },
    { q: "Sound cannot travel through:", o: ["Water", "Steel", "Vacuum", "Air"], a: 2, e: "Sound is a mechanical wave and needs a medium (solid, liquid, or gas) to travel — a vacuum has none." },
    { q: "Which of these is an example of a physical change, not a chemical one?", o: ["Rusting of iron", "Burning of wood", "Melting of ice", "Digestion of food"], a: 2, e: "Melting ice only changes the state of water; no new substance is formed." },
    { q: "Which of these best describes a theory in science?", o: ["An unproven guess", "A well-substantiated explanation supported by repeated evidence", "A law that never changes", "A personal opinion of a scientist"], a: 1, e: "A scientific theory is a broad, well-tested explanation built from repeated observation and experimentation, not a mere guess." },
    { q: "The SI base unit of time is the:", o: ["Minute", "Second", "Hour", "Day"], a: 1, e: "The second is the SI base unit of time, defined by atomic clock standards." },
    { q: "Which of these is NOT one of Newton's three laws of motion?", o: ["An object in motion stays in motion unless acted on by a force", "For every action there is an equal and opposite reaction", "Energy cannot be created or destroyed", "Force equals mass times acceleration"], a: 2, e: "Conservation of energy is a separate law, not one of Newton's three laws of motion." },
    { q: "A material that allows electricity to pass through it easily is called a(n):", o: ["Insulator", "Conductor", "Semiconductor", "Resistor"], a: 1, e: "Conductors, like copper and other metals, allow electric current to flow with little resistance." },
    { q: "Which wave type requires no medium to travel, allowing it to pass through the vacuum of space?", o: ["Sound wave", "Electromagnetic wave", "Seismic wave", "Water wave"], a: 1, e: "Electromagnetic waves, like light, travel through empty space because they don't need particles to propagate." },
    { q: "In the metric system, which prefix means one-thousandth?", o: ["Kilo-", "Centi-", "Milli-", "Mega-"], a: 2, e: "Milli- denotes 1/1000, as in millimeter or milliliter." },
    { q: "Which of these best defines density?", o: ["Mass divided by volume", "Weight divided by area", "Volume divided by mass", "Mass multiplied by volume"], a: 0, e: "Density = mass / volume, describing how tightly matter is packed into a given space." },
    { q: "A lever that has its fulcrum between the effort and the load, like a seesaw, is a:", o: ["First-class lever", "Second-class lever", "Third-class lever", "Compound lever"], a: 0, e: "In a first-class lever the fulcrum sits between the effort and the load, as in a seesaw or scissors." },
    { q: "Which of these units measures electric current?", o: ["Volt", "Watt", "Ampere", "Ohm"], a: 2, e: "The ampere (A) measures the rate of flow of electric charge, or current." },
    { q: "Friction that opposes the start of motion between two surfaces at rest is called:", o: ["Kinetic friction", "Static friction", "Rolling friction", "Fluid friction"], a: 1, e: "Static friction resists the initial motion of an object before it starts to move." },

    { q: "What is the main purpose of a control group in an experiment?", o: ["To receive the variable being tested", "To provide a baseline for comparison", "To make the experiment longer", "To guarantee the hypothesis is correct"], a: 1, e: "A control group provides a baseline so the effect of the independent variable can be compared with normal conditions." },
    { q: "Which transfer of heat occurs through direct contact between particles?", o: ["Radiation", "Convection", "Conduction", "Reflection"], a: 2, e: "Conduction transfers thermal energy through direct contact, especially in solids." },
    { q: "What is the acceleration of an object moving at constant velocity?", o: ["Zero", "1 m/s²", "9.8 m/s²", "It must increase"], a: 0, e: "Acceleration is the rate of change of velocity. If velocity remains constant, acceleration is zero." },
    { q: "Which part of the electromagnetic spectrum has the highest frequency?", o: ["Radio waves", "Microwaves", "Visible light", "Gamma rays"], a: 3, e: "Gamma rays have the highest frequencies and shortest wavelengths in the electromagnetic spectrum." },
    { q: "What happens to an object's kinetic energy when its speed increases?", o: ["It decreases", "It increases", "It stays the same", "It becomes zero"], a: 1, e: "Kinetic energy is proportional to the square of speed, so increasing speed increases kinetic energy." },
    { q: "Which process changes a liquid into a gas at its surface?", o: ["Freezing", "Condensation", "Evaporation", "Deposition"], a: 2, e: "Evaporation is the change from liquid to gas that occurs at the surface of a liquid." },
    { q: "Which measurement is most directly used to describe how hot or cold an object is?", o: ["Mass", "Temperature", "Density", "Volume"], a: 1, e: "Temperature measures the average kinetic energy of particles and indicates how hot or cold something is." },
    { q: "Which simple machine is a rigid bar that rotates around a fixed point called a fulcrum?", o: ["Pulley", "Lever", "Wheel and axle", "Inclined plane"], a: 1, e: "A lever is a rigid bar that pivots around a fulcrum to move a load." },
    { q: "What is the SI unit of force?", o: ["Joule", "Watt", "Newton", "Pascal"], a: 2, e: "The newton (N) is the SI unit of force." },
    { q: "Which property describes an object's resistance to a change in its motion?", o: ["Inertia", "Elasticity", "Buoyancy", "Conductivity"], a: 0, e: "Inertia is the tendency of an object to resist changes in its state of motion." },
    { q: "What is the main source of energy driving most ecosystems on Earth?", o: ["The Moon", "The Sun", "Wind", "Volcanoes"], a: 1, e: "Sunlight provides the primary energy input for most ecosystems through photosynthesis." },
    { q: "Which instrument is commonly used to measure temperature?", o: ["Barometer", "Thermometer", "Ammeter", "Voltmeter"], a: 1, e: "A thermometer is designed to measure temperature." },
  ],
  earth: [
    { q: "The theory that Earth's crust is broken into moving plates is called:", o: ["Plate tectonics", "Continental drift only", "Seafloor spreading only", "The rock cycle"], a: 0, e: "Plate tectonics combines continental drift and seafloor spreading into one unifying theory." },
    { q: "Which layer of the atmosphere contains the ozone layer that absorbs most UV radiation?", o: ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"], a: 1, e: "The ozone layer sits in the stratosphere, roughly 15–35 km above Earth's surface." },
    { q: "Igneous, sedimentary, and metamorphic are the three main categories of:", o: ["Minerals", "Soil", "Rocks", "Fossils"], a: 2, e: "These are the three rock types in the rock cycle, classified by how they form." },
    { q: "An earthquake's point of origin underground is called the:", o: ["Epicenter", "Focus (hypocenter)", "Fault line", "Seismic wave"], a: 1, e: "The focus is underground where rupture starts; the epicenter is the point on the surface directly above it." },
    { q: "Which type of plate boundary produces new oceanic crust?", o: ["Convergent boundary", "Divergent boundary", "Transform boundary", "Subduction boundary"], a: 1, e: "At divergent boundaries, plates move apart and magma rises to form new crust, as at mid-ocean ridges." },
    { q: "The continuous movement of water between the atmosphere, land, and oceans is the:", o: ["Carbon cycle", "Nitrogen cycle", "Water cycle", "Rock cycle"], a: 2, e: "The water (hydrologic) cycle involves evaporation, condensation, precipitation, and collection." },
    { q: "Which planet is known as the 'Red Planet'?", o: ["Venus", "Mars", "Jupiter", "Mercury"], a: 1, e: "Mars appears red due to iron oxide (rust) covering much of its surface." },
    { q: "A sudden release of built-up stress along a fault causes a(n):", o: ["Tsunami", "Volcanic eruption", "Earthquake", "Landslide"], a: 2, e: "Earthquakes result from the sudden release of accumulated stress along faults in Earth's crust." },
    { q: "Weather refers to short-term atmospheric conditions, while climate refers to:", o: ["A single day's temperature", "Long-term average weather patterns in a region", "Only rainfall amounts", "Ocean current patterns only"], a: 1, e: "Climate is the long-term average of weather conditions over decades in a given area." },
    { q: "Which layer of the Earth is primarily liquid, made mostly of iron and nickel?", o: ["Inner core", "Outer core", "Mantle", "Crust"], a: 1, e: "The outer core is molten metal, while the inner core is solid despite similar composition and higher heat." },
    { q: "Magma that reaches Earth's surface is called:", o: ["Lava", "Tephra", "Ash", "Pumice"], a: 0, e: "Once magma erupts and reaches the surface, it is renamed lava." },
    { q: "The soil horizon richest in organic matter, found at the topmost layer, is the:", o: ["O/A horizon (topsoil)", "B horizon (subsoil)", "C horizon (parent material)", "Bedrock"], a: 0, e: "Topsoil (O and A horizons) contains decomposed organic matter, or humus, supporting plant growth." },
    { q: "Which type of plate boundary is responsible for the formation of the Philippine Trench and similar deep ocean trenches?", o: ["Divergent boundary", "Convergent boundary (subduction)", "Transform boundary", "Passive margin"], a: 1, e: "At convergent boundaries, one plate subducts beneath another, carving out deep ocean trenches." },
    { q: "The scale used to measure the magnitude (energy released) of an earthquake is the:", o: ["Richter/moment magnitude scale", "Fujita scale", "Beaufort scale", "Mercalli scale"], a: 0, e: "Magnitude scales like the moment magnitude scale measure energy released; the Mercalli scale instead rates felt intensity." },
    { q: "Which gas makes up the largest percentage of Earth's atmosphere?", o: ["Oxygen", "Carbon dioxide", "Nitrogen", "Argon"], a: 2, e: "Nitrogen makes up about 78% of the atmosphere, far more than oxygen's roughly 21%." },
    { q: "A landform created by the deposition of sediment where a river meets a larger body of water is a:", o: ["Delta", "Canyon", "Plateau", "Moraine"], a: 0, e: "A delta forms as a river slows and drops its sediment load upon entering the sea or a lake." },
    { q: "Which type of volcano is characterized by a broad, gently sloping profile built from fluid basaltic lava?", o: ["Composite (stratovolcano)", "Shield volcano", "Cinder cone", "Caldera"], a: 1, e: "Shield volcanoes, like those in Hawaii, are built from low-viscosity lava that spreads out over wide areas." },
    { q: "The phases of the Moon are caused primarily by:", o: ["Earth's shadow falling on the Moon", "The changing angle at which we view the Moon's sunlit half", "The Moon's rotation on its axis", "Clouds passing in front of the Moon"], a: 1, e: "As the Moon orbits Earth, we see varying portions of its sunlit side, producing the phases." },

let session = { topic: null, list: [], idx: 0, score: 0, wrong: [] };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSet(topicKey) {
  if (topicKey === 'mixed') {
    let all = [];
    Object.keys(QUESTIONS).forEach(t => {
      QUESTIONS[t].forEach(q => all.push(Object.assign({ topic: t }, q)));
    });
    return shuffle(all);
  }
  return shuffle(QUESTIONS[topicKey].map(q => Object.assign({ topic: topicKey }, q)));
}

// fill counts on select screen
Object.keys(QUESTIONS).forEach(t => {
  document.getElementById('count-' + t).textContent = QUESTIONS[t].length + ' items';
});
document.getElementById('count-mixed').textContent =
  Object.values(QUESTIONS).reduce((s, arr) => s + arr.length, 0) + ' items';

const screenSelect = document.getElementById('screen-select');
const screenQuiz = document.getElementById('screen-quiz');
const screenResults = document.getElementById('screen-results');

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('click', () => startQuiz(card.dataset.topic));
});
document.getElementById('quit-btn').addEventListener('click', () => showScreen('select'));
document.getElementById('retry-btn').addEventListener('click', () => showScreen('select'));
document.getElementById('next-btn').addEventListener('click', nextQuestion);

function showScreen(name) {
  screenSelect.classList.toggle('hidden', name !== 'select');
  screenQuiz.classList.toggle('hidden', name !== 'quiz');
  screenResults.classList.toggle('hidden', name !== 'results');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function startQuiz(topicKey) {
  session = { topic: topicKey, list: buildSet(topicKey), idx: 0, score: 0, wrong: [] };
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const item = session.list[session.idx];
  const meta = TOPIC_META[item.topic];
  document.documentElement.style.setProperty('--topic-color', meta.color);
  document.documentElement.style.setProperty('--topic-bg', meta.bg);

  const tag = document.getElementById('q-topic-tag');
  tag.textContent = meta.label;
  tag.style.color = meta.color;
  tag.style.background = meta.bg;

  document.getElementById('q-text').textContent = item.q;
  document.getElementById('score-pill').textContent = session.score + '/' + session.idx + ' correct';
  document.getElementById('progress-fill').style.width = ((session.idx) / session.list.length * 100) + '%';

  const letters = ['A', 'B', 'C', 'D'];
  const order = shuffle(item.o.map((text, i) => ({ text, isCorrect: i === item.a })));

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  order.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt.text + '</span>';
    btn.addEventListener('click', () => selectAnswer(btn, opt, order, item));
    optsDiv.appendChild(btn);
  });

  const explain = document.getElementById('explain');
  explain.classList.remove('show');
  explain.textContent = item.e || '';
  document.getElementById('next-btn').classList.remove('show');
}

function selectAnswer(btn, opt, order, item) {
  const allBtns = document.querySelectorAll('#options .opt');
  if (allBtns[0].classList.contains('locked')) return;

  allBtns.forEach((b, i) => {
    b.classList.add('locked');
    if (order[i].isCorrect) b.classList.add('correct');
    else b.classList.add('dim');
  });

  if (opt.isCorrect) {
    session.score++;
  } else {
    btn.classList.remove('dim');
    btn.classList.add('wrong');
    session.wrong.push({ q: item.q, your: opt.text, correct: item.o[item.a] });
  }

  document.getElementById('score-pill').textContent = session.score + '/' + (session.idx + 1) + ' correct';
  const explain = document.getElementById('explain');
  if (explain.textContent) explain.classList.add('show');
  document.getElementById('next-btn').classList.add('show');
  document.getElementById('next-btn').textContent =
    session.idx + 1 < session.list.length ? 'Next question' : 'See results';
}

function nextQuestion() {
  session.idx++;
  if (session.idx >= session.list.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('progress-fill').style.width = '100%';
  const total = session.list.length;
  const pct = Math.round((session.score / total) * 100);
  document.getElementById('result-score').textContent = pct + '%';
  document.getElementById('result-frac').textContent = session.score + ' / ' + total + ' correct';

  let msg;
  if (pct === 100) msg = "Perfect set. Onstage-ready.";
  else if (pct >= 80) msg = "Strong — a quick pass over the misses and you're set.";
  else if (pct >= 60) msg = "Solid base. Review the wrong ones below before tomorrow.";
  else msg = "Good diagnostic run. Go through the review list, then retry this set.";
  document.getElementById('result-msg').textContent = msg;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '';
  if (session.wrong.length) {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = 'Review — ' + session.wrong.length + ' missed';
    reviewList.appendChild(label);
    session.wrong.forEach(w => {
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML =
        '<div class="rq">' + w.q + '</div>' +
        '<div class="ra you">Your answer: ' + w.your + '</div>' +
        '<div class="ra right">Correct: ' + w.correct + '</div>';
      reviewList.appendChild(div);
    });
  }
  showScreen('results');
}
